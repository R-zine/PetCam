[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "petcam-ml"
version = "0.1.0"
description = "Session-safe posture classification tools for PetCam"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PetCam contributors" }]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "tensorboard>=2.14",
  "timm>=1.0",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
petcam-ml = "petcam_ml.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/petcam_ml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]


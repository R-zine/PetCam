[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rabbitcam-ml"
version = "0.1.0"
description = "Session-safe posture classification tools for RabbitCam"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RabbitCam contributors" }]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "tensorboard>=2.14",
  "timm>=1.0",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rabbitcam-ml = "rabbitcam_ml.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rabbitcam_ml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

